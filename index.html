    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mumbai Metro Route Finder</title>
  <meta name="description" content="Find the best Mumbai Metro routes, line interchanges, fare estimates, and station information easily." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HERO SECTION WITH MUMBAI LANDMARKS COLLAGE -->
  <header class="hero-container">
    
    <!-- Mumbai Landmarks Layer -->
    <div class="mumbai-landmarks-bg" aria-hidden="true">
      <!-- Marine Drive (Left) -->
      <svg class="landmark landmark-marine-drive" viewBox="0 0 500 250" preserveAspectRatio="xMinYMax slice">
        <path d="M0,180 Q150,160 300,210 T500,200 L500,250 L0,250 Z" fill="rgba(255,255,255,0.18)"/>
        <path d="M0,195 Q150,175 300,220 T500,210" fill="none" stroke="rgba(255,215,0,0.4)" stroke-width="3" stroke-dasharray="4 6"/>
        <circle cx="80" cy="190" r="2" fill="#ffd700"/>
        <circle cx="160" cy="180" r="2" fill="#ffd700"/>
        <circle cx="240" cy="190" r="2" fill="#ffd700"/>
        <circle cx="320" cy="210" r="2" fill="#ffd700"/>
      </svg>

      <!-- Bandra-Worli Sea Link (Center/Left) -->
      <svg class="landmark landmark-sealink" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax meet">
        <polygon points="120,300 135,110 145,110 160,300" fill="rgba(255,255,255,0.22)"/>
        <polygon points="240,300 255,70 265,70 280,300" fill="rgba(255,255,255,0.25)"/>
        <path d="M140,120 L40,300 M140,120 L70,300 M140,120 L100,300 M140,120 L180,300 M140,120 L210,300" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
        <path d="M260,80 L150,300 M260,80 L180,300 M260,80 L220,300 M260,80 L300,300 M260,80 L340,300 M260,80 L370,300" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
        <rect x="0" y="280" width="400" height="8" fill="rgba(255,255,255,0.3)"/>
      </svg>

      <!-- Gateway of India (Right) -->
      <svg class="landmark landmark-gateway" viewBox="0 0 300 300" preserveAspectRatio="xMaxYMax meet">
        <path d="M50,300 L50,120 L70,100 L230,100 L250,120 L250,300 Z" fill="rgba(255,255,255,0.15)"/>
        <path d="M100,300 L100,200 Q150,150 200,200 L200,300 Z" fill="rgba(5,20,45,0.65)"/>
        <rect x="40" y="80" width="30" height="40" fill="rgba(255,255,255,0.2)"/>
        <rect x="230" y="80" width="30" height="40" fill="rgba(255,255,255,0.2)"/>
        <path d="M110,100 Q150,60 190,100 Z" fill="rgba(255,255,255,0.22)"/>
      </svg>

      <!-- CSMT Terminus (Lower/Right Background) -->
      <svg class="landmark landmark-csmt" viewBox="0 0 350 250" preserveAspectRatio="xMaxYMax slice">
        <path d="M50,250 L50,160 L120,130 L175,70 L230,130 L300,160 L300,250 Z" fill="rgba(255,255,255,0.1)"/>
        <path d="M145,80 Q175,20 205,80 Z" fill="rgba(255,255,255,0.15)"/>
        <line x1="175" y1="20" x2="175" y2="5" stroke="rgba(255,215,0,0.5)" stroke-width="2"/>
        <circle cx="175" cy="110" r="16" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      </svg>
    </div>

    <!-- Dark Overlay Filter -->
    <div class="hero-overlay"></div>

    <!-- Hero Interactive Content -->
    <div class="hero-content">
      <h1>Mumbai Metro Route Finder</h1>
      <h2>Find Your Best Mumbai Metro Route</h2>

      <!-- Glassmorphism Card -->
      <div class="glass-route-card">
        <form id="route-form" autocomplete="off" onsubmit="return false;">
          
          <div class="input-group">
            <label for="from-station">FROM STATION</label>
            <div class="autocomplete-wrapper">
              <input 
                type="text" 
                id="from-station" 
                placeholder="Search starting station..." 
                autocomplete="off" 
                required
              />
              <div id="from-autocomplete-list" class="autocomplete-items"></div>
            </div>
          </div>

          <div class="input-group">
            <label for="to-station">TO STATION</label>
            <div class="autocomplete-wrapper">
              <input 
                type="text" 
                id="to-station" 
                placeholder="Search destination station..." 
                autocomplete="off" 
                required
              />
              <div id="to-autocomplete-list" class="autocomplete-items"></div>
            </div>
          </div>

          <button type="submit" id="find-route-btn" class="btn-primary">
            FIND METRO ROUTE
          </button>

        </form>
      </div>
    </div>
  </header>

  <!-- Route Output -->
  <main class="main-container">
    <div id="route-results" class="results-container"></div>
  </main>

  <script src="js/metro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
